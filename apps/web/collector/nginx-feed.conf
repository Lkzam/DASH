# /etc/nginx/snippets/opinai-feed.conf — incluído no server HTTPS do opina-ai.com.
# Serve os JSON e fotos publicados pelo coletor (fora do build do app).
location /feed/ {
    alias /var/www/opinai/feed/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=5, s-maxage=5, stale-while-revalidate=30, stale-if-error=600" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
}
