# ============================================================
# Render Blueprint — OpinAI (servidor Node + Hono SSR)
# Deploy: https://render.com → New → Blueprint → conecta o repo Lkzam/DASH
# Os segredos (sync:false) você preenche no painel do Render, NÃO aqui.
# ============================================================
services:
  - type: web
    name: opinai
    runtime: node
    rootDir: apps/web          # monorepo: o app fica em apps/web
    plan: free                 # grátis, NÃO exige cartão (dorme após ~15min de
                               # inatividade → cold start). Para produção com
                               # vendas, troque para 'starter' (~US$7/mês) e o
                               # Render pedirá o cartão só então.
    # --include=dev: NODE_ENV=production faz o npm pular devDependencies, mas o
    # CLI de build (react-router/dev, vite) está lá. Forçamos a instalação delas.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start    # = node ./build/server/index.js
    healthCheckPath: /
    autoDeploy: true           # redeploy automático a cada push no GitHub
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # ---- Segredos: preencher no painel do Render (Environment) ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ---- Asaas (pagamento / assinaturas) ----
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      # Opcional: URL da API. Padrão = produção. Sandbox p/ testes:
      # https://api-sandbox.asaas.com/v3
      - key: ASAAS_API_URL
        sync: false
      # Pepper do hash de CPF (API pública do app). NUNCA alterar depois
      # que houver dados — invalidaria todos os hashes já gravados.
      - key: CPF_PEPPER
        sync: false
      # APP_URL = URL pública final (seu domínio Hostinger, com https)
      - key: APP_URL
        sync: false
      # CORS_ORIGINS = mesmo domínio (separe por vírgula se houver mais de um)
      - key: CORS_ORIGINS
        sync: false
